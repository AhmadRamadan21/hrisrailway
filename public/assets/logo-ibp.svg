      <rect x="18" y="58" width="3.2" height="6" />
      <rect x="24" y="58" width="3.2" height="6" />
      <rect x="30" y="58" width="3.2" height="6" />
      <rect x="18" y="68" width="3.2" height="6" />
      <rect x="24" y="68" width="3.2" height="6" />
      <rect x="30" y="68" width="3.2" height="6" />
